<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<script th:fragment="themeBootstrap">
    (function () {
        try {
            const t = localStorage.getItem('admin-theme');
            document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
        try {
            if (localStorage.getItem('admin-sidebar') === 'collapsed') {
                document.documentElement.setAttribute('data-sidebar', 'collapsed');
            }
        } catch (e) {
            // Ignore storage restrictions.
        }
    })();
</script>


<aside class="sidebar" id="sidebar" th:fragment="sidebar(activePage)">
    <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span class="brand-name">Ruslo</span>
    </div>
    <nav class="side-nav" aria-label="Main">
        <a href="./"
           title="Dashboard"
           th:classappend="${activePage == 'dashboard'} ? ' active' : ''"
           th:attr="aria-current=${activePage == 'dashboard'} ? 'page' : null">
            <svg class="icon" aria-hidden="true"><use href="#ti-layout-grid"></use></svg>
            <span class="nav-label">Dashboard</span>
        </a>
        <a href="./processes"
           title="Processes"
           th:classappend="${activePage == 'processes'} ? ' active' : ''"
           th:attr="aria-current=${activePage == 'processes'} ? 'page' : null">
            <svg class="icon" aria-hidden="true"><use href="#ti-list"></use></svg>
            <span class="nav-label">Processes</span>
        </a>
    </nav>
    <footer class="sidebar-footer">
        <!-- admin.js keeps aria-expanded, aria-label and title in sync with the collapsed state. -->
        <button type="button"
                class="sidebar-toggle"
                data-sidebar-toggle
                aria-controls="sidebar"
                aria-expanded="true"
                aria-label="Collapse sidebar"
                title="Collapse sidebar">
            <svg class="icon sidebar-toggle-collapse" aria-hidden="true"><use href="#ti-layout-sidebar-left-collapse"></use></svg>
            <svg class="icon sidebar-toggle-expand" aria-hidden="true"><use href="#ti-layout-sidebar-left-expand"></use></svg>
            <span class="nav-label">Collapse</span>
        </button>
    </footer>
</aside>

<button type="button"
        class="theme-toggle"
        data-theme-toggle
        role="switch"
        aria-checked="false"
        aria-label="Toggle theme"
        title="Toggle theme"
        th:fragment="themeToggle">
    <span class="theme-toggle-track" aria-hidden="true">
        <span class="theme-toggle-thumb">
            <svg class="icon theme-icon-light" aria-hidden="true"><use href="#ti-sun"></use></svg>
            <svg class="icon theme-icon-dark" aria-hidden="true"><use href="#ti-moon"></use></svg>
        </span>
    </span>
</button>

<header class="top-strip" th:fragment="topStrip(breadcrumbs)">
    <nav class="breadcrumbs strip-title" aria-label="Breadcrumb">
        <th:block th:each="breadcrumb, iter : ${breadcrumbs}">
            <a th:if="${!breadcrumb.current()}"
               th:href="${breadcrumb.href()}"
               th:title="${breadcrumb.title()}"
               th:text="${breadcrumb.label()}">Parent</a>
            <span th:if="${breadcrumb.current()}"
                  class="crumb-current"
                  th:title="${breadcrumb.title()}"
                  th:attr="aria-current=${breadcrumb.current()} ? 'page' : null"
                  th:text="${breadcrumb.label()}">Current</span>
            <span th:if="${!iter.last}" class="crumb-sep" aria-hidden="true">›</span>
        </th:block>
    </nav>
    <div class="strip-chrome">
        <button th:replace="~{ruslo-admin/shared/fragments :: themeToggle}"></button>
    </div>
</header>

<div class="status-line"
     th:fragment="statusLine"
     th:classappend="${error == true} ? ' error' : ''"
     th:text="${status}">Status</div>

<span class="badge"
      th:fragment="statusBadge(status)"
      th:classappend="|status-${#strings.toLowerCase(status)}|"
      th:text="${status}">ACTIVE</span>

<button type="button"
        class="icon-btn copy-btn"
        th:fragment="copyButton(value, label)"
        th:disabled="${value == null}"
        th:attr="data-copy=${value},aria-label=${label},title=${label}"><svg class="icon" aria-hidden="true"><use href="#ti-copy"></use></svg></button>

<!-- Replaces the browser confirm() for hx-confirm: admin.js fills the question and issues the request on Confirm. -->
<dialog class="small-modal confirm-modal" id="confirm-dialog" th:fragment="confirmDialog">
    <article>
        <header class="modal-header">
            <div>
                <h2>Confirm action</h2>
            </div>
            <button class="icon-btn" type="button" data-modal-close aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#ti-x"></use></svg></button>
        </header>
        <div class="modal-body">
            <p id="confirm-dialog-question">Are you sure?</p>
            <div class="action-bar">
                <button type="button" class="secondary" data-modal-close>Cancel</button>
                <button type="button" data-confirm-accept>Confirm</button>
            </div>
        </div>
    </article>
</dialog>

<div class="diagram-legend" aria-label="Diagram legend" th:fragment="diagramLegend(instance)">
    <span class="legend-step">Step</span>
    <span class="legend-await">Await</span>
    <span class="legend-terminal">Terminal</span>
    <span class="legend-message">Message</span>
    <span class="legend-timer">Timer</span>
    <th:block th:if="${instance}">
        <span class="legend-visited">Visited</span>
        <span class="legend-current">Current</span>
        <span class="legend-failed">Failed</span>
        <span class="legend-manual">Manual move</span>
    </th:block>
    <span class="diagram-legend-hint">Ctrl/⌘ + scroll to zoom</span>
</div>
</body>
</html>
