plugins {
    id 'java'
}

// After deploying Ruslo to a local Maven repository, copy this fixture to a temporary directory and run:
// gradle test -PrusloRepository=<repository-directory> -PrusloVersion=<deployed-version>
repositories {
    maven {
        url = uri(providers.gradleProperty('rusloRepository').get())
        content {
            includeGroup 'io.github.neherim'
        }
    }
    mavenCentral()
}

dependencies {
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka:4.1.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:4.1.0'
    testImplementation "io.github.neherim:ruslo-spring-boot-starter-test:${providers.gradleProperty('rusloVersion').get()}"
}

test {
    useJUnitPlatform()
}
